 = 0</text><text x="380.0" y="220.00" font-family="DejaVu Sans" font-size="15" text-anchor="middle" fill="#000000">step = 0</text><polygon fill="#ffffff" stroke="#000000" stroke-width="1.6" points="380.0,259.0 473.0,300.0 380.0,341.0 287.0,300.0" /><text x="380.0" y="305.00" font-family="DejaVu Sans" font-size="15" text-anchor="middle" fill="#000000">step &lt; 5?</text><polygon fill="#ffffff" stroke="#000000" stroke-width="1.6" points="287.5,387.5 490.5,387.5 472.5,452.5 269.5,452.5" /><text x="380.0" y="415.00" font-family="DejaVu Sans" font-size="15" text-anchor="middle" fill="#000000">Ввести показания серии:</text><text x="380.0" y="435.00" font-family="DejaVu Sans" font-size="15" text-anchor="middle" fill="#000000">web, dbs, iop</text><polygon fill="#ffffff" stroke="#000000" stroke-width="1.6" points="380.0,489.0 522.0,550.0 380.0,611.0 238.0,550.0" /><text x="380.0" y="535.00" font-family="DejaVu Sans" font-size="15" text-anchor="middle" fill="#000000">web == -99999</text><text x="380.0" y="555.00" font-family="DejaVu Sans" font-size="15" text-anchor="middle" fill="#000000">|| dbs == -99999</text><text x="380.0" y="575.00" font-family="DejaVu Sans" font-size="15" text-anchor="middle" fill="#000000">|| iop == -99999?</text><rect fill="#ffffff" stroke="#000000" stroke-width="1.6" x="313.0" y="656.0" width="134.0" height="48" /><text x="380.0" y="685.00" font-family="DejaVu Sans" font-size="15" text-anchor="middle" fill="#000000">step = step + 1</text><polygon fill="#ffffff" stroke="#000000" stroke-width="1.6" points="380.0,749.0 482.0,790.0 380.0,831.0 278.0,790.0" /><text x="380.0" y="795.00" font-family="DejaVu Sans" font-size="15" text-anchor="middle" fill="#000000">step &lt;= 3?</text><rect fill="#ffffff" stroke="#000000" stroke-width="1.6" x="557.5" y="727.5" width="205.0" height="125" /><text x="660.0" y="755.00" font-family="DejaVu Sans" font-size="15" text-anchor="middle" fill="#000000">Сохранение в окно:</text><text x="660.0" y="775.00" font-family="Deja